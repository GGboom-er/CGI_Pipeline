<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGI Pipeline — 报告查看器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f0f1a;
            --surface: #16172a;
            --surface2: #1e1f36;
            --border: #2a2b45;
            --text: #e6edf3;
            --text-dim: #7b8794;
            --accent: #7c6aef;
            --success: #3fb950;
            --error: #f85149;
            --warning: #d29922;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Bar ── */
        .topbar {
            height: 48px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            flex-shrink: 0;
        }

        .topbar .logo {
            font-weight: 700;
            font-size: 14px;
            background: linear-gradient(135deg, #7c6aef, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .topbar .sep {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.08);
        }

        .topbar .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .topbar .nav-link:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
        }

        .topbar .nav-link.active {
            color: var(--accent);
            background: rgba(124, 106, 239, 0.12);
        }

        .topbar .refresh-btn {
            margin-left: auto;
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .topbar .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ── Layout ── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Report List ── */
        .report-list {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .report-list .header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-list .header .count {
            background: rgba(124, 106, 239, 0.2);
            color: var(--accent);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
        }

        .report-list .items {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .report-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.12s;
            margin-bottom: 2px;
        }

        .report-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .report-item.active {
            background: rgba(124, 106, 239, 0.12);
            border-left: 2px solid var(--accent);
        }

        .report-item .name {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 3px;
            word-break: break-all;
        }

        .report-item .meta {
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            gap: 12px;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
        }

        .empty-state .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        /* ── Report Content ── */
        .report-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 48px;
            background: var(--bg);
        }

        .report-content .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            font-size: 13px;
        }

        .report-content .placeholder .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* ── Markdown Styles ── */
        .md-body {
            max-width: 900px;
            line-height: 1.7;
        }

        .md-body h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            background: linear-gradient(135deg, #e6edf3, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .md-body h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 28px;
            margin-bottom: 12px;
            color: #c0cadb;
        }

        .md-body h3 {
            font-size: 15px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #a0b0c0;
        }

        .md-body p {
            margin-bottom: 10px;
        }

        .md-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 12px;
        }

        .md-body th {
            background: var(--surface2);
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .md-body td {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.01);
        }

        .md-body tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .md-body code {
            background: rgba(124, 106, 239, 0.12);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            color: #c0aaff;
        }

        .md-body pre {
            background: var(--surface);
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .md-body pre code {
            background: none;
            padding: 0;
        }

        .md-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 24px 0;
        }

        .md-body ul,
        .md-body ol {
            padding-left: 24px;
            margin-bottom: 10px;
        }

        .md-body li {
            margin-bottom: 4px;
            font-size: 13px;
        }

        .md-body strong {
            color: #d0dae8;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <span class="logo">CGI Pipeline</span>
        <span class="sep"></span>
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/nodes" class="nav-link">节点编辑器</a>
        <a href="/report" class="nav-link active">报告</a>
        <button class="refresh-btn" onclick="loadReports()">🔄 刷新</button>
    </div>

    <div class="main">
        <div class="report-list">
            <div class="header">
                <span>报告列表</span>
                <span class="count" id="report-count">0</span>
            </div>
            <div class="items" id="report-items">
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <div>暂无报告</div>
                    <div style="margin-top:6px;font-size:10px">从节点编辑器执行任务后自动生成</div>
                </div>
            </div>
        </div>

        <div class="report-content" id="report-content">
            <div class="placeholder">
                <div class="icon">📄</div>
                <div>选择左侧报告查看内容</div>
            </div>
        </div>
    </div>

    <script>
        let currentRunId = null;

        async function loadReports() {
            try {
                const r = await fetch('/api/reports');
                const data = await r.json();
                const reports = data.reports || [];
                document.getElementById('report-count').textContent = reports.length;

                const container = document.getElementById('report-items');
                if (reports.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📋</div>
                            <div>暂无报告</div>
                            <div style="margin-top:6px;font-size:10px">从节点编辑器执行任务后自动生成</div>
                        </div>`;
                    return;
                }

                container.innerHTML = '';
                reports.forEach(report => {
                    const el = document.createElement('div');
                    el.className = 'report-item' + (report.run_id === currentRunId ? ' active' : '');
                    const date = new Date(report.modified * 1000);
                    const timeStr = date.toLocaleString('zh-CN', { hour12: false });
                    const sizeKB = (report.size / 1024).toFixed(1);
                    el.innerHTML = `
                        <div class="name">${report.run_id}</div>
                        <div class="meta">
                            <span>📅 ${timeStr}</span>
                            <span>📦 ${sizeKB} KB</span>
                        </div>`;
                    el.onclick = () => viewReport(report.run_id);
                    container.appendChild(el);
                });
            } catch (e) {
                console.error('加载报告列表失败:', e);
            }
        }

        async function viewReport(runId) {
            currentRunId = runId;
            // 更新选中态
            document.querySelectorAll('.report-item').forEach(el => {
                el.classList.toggle('active', el.querySelector('.name').textContent === runId);
            });

            try {
                const r = await fetch(`/api/reports/${runId}`);
                const data = await r.json();
                if (data.error) {
                    document.getElementById('report-content').innerHTML =
                        `<div class="placeholder"><div class="icon">⚠️</div><div>${data.error}</div></div>`;
                    return;
                }
                const html = marked.parse(data.content);
                document.getElementById('report-content').innerHTML = `<div class="md-body">${html}</div>`;
            } catch (e) {
                document.getElementById('report-content').innerHTML =
                    `<div class="placeholder"><div class="icon">❌</div><div>加载失败: ${e.message}</div></div>`;
            }
        }

        // ── Init ──
        loadReports();
        // 自动刷新
        setInterval(loadReports, 15000);
    </script>
</body>

</html>
