api_id: maya.rig.maya_check_asset_hierarchy
version: 1.0.0
name: maya_check_rig_geometry_layout
dcc: maya
domain: rig
action: maya_check_asset_hierarchy
tier: read
execution_modes:
- background
- foreground
operation_modes:
- inspect
inputs:
  stage:
    type: string
    default: rig
    description: 项目阶段。用于读取 config/{project}_config.json 中 stages[stage].geom_roots[0]
      作为标准根。
  phase:
    type: string
    default: post_sync
    description: 检查阶段。pre_sync 要求存在可供同步读取的旧绑定几何根；post_sync 要求标准 cache 根存在并有 mesh。
  block_on_fail:
    type: boolean
    default: true
    description: 检查失败时是否返回 AUDIT_FAILED。false 时仍返回 SUCCESS，但 output.result.passed=false。
  block_extra_top_nodes:
    type: boolean
    default: false
    description: 是否把非空额外顶层节点作为阻断项。默认 false，仅输出风险事实，避免误阻断或误删绑定系统。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
side_effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
idempotent: true
outputs:
- name: result
  type: json
  label: 层级 QC 结果
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 纯 QC 检查：从项目配置读取当前 stage 的标准几何根，确认标准根存在、标准根下有有效 mesh，并输出层级修复节点需要消费的只读事实。
  usage: execute_api(maya.rig.maya_check_asset_hierarchy, params={...})
  scenario: 纯 QC 检查：从项目配置读取当前 stage 的标准几何根，确认标准根存在、标准根下有有效 mesh，并输出层级修复节点需要消费的只读事实。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: api.operations.maya_check_asset_hierarchy.adapter:execute
