api_id: maya.rig.maya_sync_rig_incremental
version: 1.0.0
name: maya_sync_abc_to_rig_cache
dcc: maya
domain: rig
action: maya_sync_rig_incremental
tier: destructive
execution_modes:
- background
- foreground
operation_modes:
- apply
inputs:
  compare_result:
    type: string
    default: ''
    description: 必填。maya_compare_asset_in_scene 或 pipeline_compare_asset 输出的 compare_result.json
      路径；workflow 内也可直接传 output.compare_result 字典。sync 只消费其中 pairing_groups，不重新对比。
  source_abc:
    type: string
    default: ''
    description: source 侧 ABC 文件路径。source 独有 mesh 需要完整拓扑，推荐传 ABC。
  source_info:
    type: string
    default: ''
    description: source 侧 _info.json 路径。无 ABC 时的降级路径，仅能更新已有 mesh，不能可靠创建 source 独有
      mesh。
  cache_group:
    type: string
    default: cache
    description: target rig 几何根组。workflow 应从项目配置传入。
  dry_run:
    type: boolean
    default: false
    description: 兼容旧调用参数。只看差异请使用 maya_compare_asset_in_scene，本API执行真实拼装。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
side_effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
idempotent: false
outputs:
- name: scene
  type: scene_file
  label: 同步后 rig 场景
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 在 target rig 场景中，依据前置 compare_result 和 source ABC 增量重建/更新 mesh（纯几何）。注入/重建时传
    UV 与可用显式法线，面序固定对齐 Maya AbcImport，不猜测几何外侧。
  usage: execute_api(maya.rig.maya_sync_rig_incremental, params={...})
  scenario: 在 target rig 场景中，依据前置 compare_result 和 source ABC 增量重建/更新 mesh（纯几何）。注入/重建时传
    UV 与可用显式法线，面序固定对齐 Maya AbcImport，不猜测几何外侧。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: api.operations.maya_sync_rig_incremental.adapter:execute
