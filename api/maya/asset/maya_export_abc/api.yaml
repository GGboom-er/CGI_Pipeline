api_id: maya.asset.maya_export_abc
version: 1.0.0
name: Maya 导出 ABC
dcc: maya
domain: asset
action: maya_export_abc
tier: write
execution_modes:
- background
- foreground
operation_modes:
- apply
inputs:
  abc_path:
    type: string
    default: ''
    description: ABC 输出完整路径。workflow 中必须传入任务沙盒 .info 路径；为空时从任务沙盒自动推导。
  frame_range:
    type: array
    default:
    - 1
    - 1
    description: 导出帧范围 [start, end]
  root_nodes:
    type: string
    default: ''
    description: 要导出的根节点列表。为空则导出全部顶层。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
side_effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
idempotent: false
outputs:
- name: abc
  type: abc_file
  label: 导出的 .abc
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 将当前 Maya 场景导出为 Alembic (.abc)，含 UV、FaceSet、可见性，Ogawa 格式。不保留 skinCluster。
  usage: execute_api(maya.asset.maya_export_abc, params={...})
  scenario: 将当前 Maya 场景导出为 Alembic (.abc)，含 UV、FaceSet、可见性，Ogawa 格式。不保留 skinCluster。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: api.operations.maya_export_abc.adapter:execute
