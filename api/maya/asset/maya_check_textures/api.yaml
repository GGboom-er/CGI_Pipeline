api_id: maya.asset.maya_check_textures
version: 1.0.0
name: 贴图检查
dcc: maya
domain: asset
action: maya_check_textures
tier: read
execution_modes:
- background
- foreground
operation_modes:
- inspect
inputs:
  check_exists:
    type: boolean
    default: true
    description: 是否检查贴图文件在磁盘上是否存在
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
side_effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
idempotent: true
outputs:
- name: scene
  type: scene_file
  label: 检查后场景
- name: report
  type: report
  label: 检查报告 (.md)
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 扫描 Maya 场景中所有 file 节点，检查贴图是否存在于磁盘（支持 UDIM），按目录分组汇总报告。
  usage: execute_api(maya.asset.maya_check_textures, params={...})
  scenario: 扫描 Maya 场景中所有 file 节点，检查贴图是否存在于磁盘（支持 UDIM），按目录分组汇总报告。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: api.operations.maya_check_textures.adapter:execute
