# Notes shared Python runtime for CGI Pipeline and brain tooling.
# Rebuild this prefix through bin/setup.bat; do not create a second named env.
# Runtime baseline: Python 3.11.

channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pip
  - openvdb=13.0.0
  - pytorch=2.10.0
  - pytorch3d=0.7.9
  - torchvision=0.25.0
  - rtree=1.4.1
  - pip:
    - celery==5.4.0
    - redis==5.2.1
    - fastmcp==3.2.4
    - rpyc==6.0.2
    - filelock==3.16.1
    - psutil==7.2.2
    - python-dotenv>=1.1.0
    - uvicorn>=0.35.0
    - flower==2.0.1
    - future==1.0.0
    - pytest==9.0.3
    - libigl==2.6.1
    - open3d==0.19.0
    - probreg==0.3.8
    - scipy==1.17.1
    - scikit-learn==1.8.0
    - matplotlib==3.10.9
    - transforms3d==0.4.2
