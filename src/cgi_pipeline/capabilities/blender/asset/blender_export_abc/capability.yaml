api_id: blender.asset.blender_export_abc
version: 1.0.1
name: blender_export_cache_to_abc
executor: blender
capability: asset.exchange
operation: export
stages:
- modeling
- rigging
- animation
targets:
- asset
- alembic
access: write
effects:
  scene_read: Reads the export group and its descendants.
  scene_write: Unhides the scene, changes selection and disables mesh modifiers; the current implementation does not restore
    these states.
  file_write: Exports the requested Alembic archive.
execution_modes:
- local
- background
- foreground
surfaces:
- blender
- service
modes:
- apply
inputs:
  abc_path:
    type: string
    default: ''
    description: ABC 输出完整路径。workflow 中必须传入任务沙盒 .info 路径；为空时从任务沙盒自动推导。
  cache_group:
    type: string
    default: ''
    description: 要导出的组名（为空则从项目推断即可）
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 选中指定几何根组，禁用修改器，导出 Alembic (.abc)。只管 ABC 几何导出，不生成 _info.json 或 _materials.json。
  usage: execute_api(blender.asset.blender_export_abc, params={...})
  scenario: 选中指定几何根组，禁用修改器，导出 Alembic (.abc)。只管 ABC 几何导出，不生成 _info.json 或 _materials.json。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation:
  status: implemented
verification:
  level: live_tested
  evidence:
  - audit/wf-96a64ab7.json
handler: cgi_pipeline.capabilities.blender.asset.blender_export_abc.adapter:execute
