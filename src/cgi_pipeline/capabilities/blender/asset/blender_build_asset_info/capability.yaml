api_id: blender.asset.blender_build_asset_info
version: 1.0.1
name: Blender 资产信息采集
executor: blender
capability: asset.metadata
operation: build
stages:
- modeling
targets:
- asset
- mesh
access: write
effects:
  scene_read: Reads root-group geometry and asset metadata.
  file_write: Creates the output directory and writes the business _info.json.
execution_modes:
- local
- background
- foreground
surfaces:
- blender
- service
modes:
- inspect
inputs:
  info_path:
    type: string
    default: ''
    description: _info.json 输出完整路径。workflow 中必须传入任务沙盒 .info 路径；为空时从任务沙盒自动推导。
  cache_group:
    type: string
    description: 必填。要采集的 Blender 根对象名，由项目配置或 workflow 传入。
    required: true
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 遍历指定 Blender 几何根组下所有 mesh，采集拓扑指纹（顶点数+世界空间坐标），输出标准 _info.json。只负责几何信息，不采集贴图或面级材质。
  usage: execute_api(blender.asset.blender_build_asset_info, params={...})
  scenario: 遍历指定 Blender 几何根组下所有 mesh，采集拓扑指纹（顶点数+世界空间坐标），输出标准 _info.json。只负责几何信息，不采集贴图或面级材质。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation:
  status: implemented
verification:
  level: live_tested
  evidence:
  - audit/api-11ffdecaeccc.json
handler: cgi_pipeline.capabilities.blender.asset.blender_build_asset_info.adapter:execute
