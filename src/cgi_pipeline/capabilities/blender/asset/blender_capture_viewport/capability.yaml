api_id: blender.asset.blender_capture_viewport
version: 1.0.1
name: Blender 视口截图
executor: blender
capability: viewport.capture
operation: capture
stages:
- modeling
- rigging
- animation
targets:
- viewport
access: write
effects:
  scene_read: Renders the selected Blender scene.
  scene_write: Temporarily changes render path, resolution and format; finally restores those settings.
  file_write: Standard render writes the requested PNG image.
execution_modes:
- local
- background
- foreground
surfaces:
- blender
- service
modes:
- inspect
inputs:
  width:
    type: number
    default: 1920
    description: 截图宽度
  height:
    type: number
    default: 1080
    description: 截图高度
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 获取 Blender 当前活动视口或后台渲染截图，并保存为 PNG。
  usage: execute_api(blender.asset.blender_capture_viewport, params={...})
  scenario: 获取 Blender 当前活动视口或后台渲染截图，并保存为 PNG。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation:
  status: implemented
verification:
  level: live_tested
  evidence:
  - audit/api-fa44c31dd689.json
handler: cgi_pipeline.capabilities.blender.asset.blender_capture_viewport.adapter:execute
