api_id: blender.asset.blender_exec_code
version: 1.0.1
name: Blender 动态代码执行
executor: blender
capability: runtime.code
operation: execute
stages:
- modeling
- rigging
- animation
targets:
- host_runtime
access: destructive
effects:
  code_execute: Executes caller-provided Python. Scene, file and host effects depend on the code; the open wrapper is not
    complete isolation.
execution_modes:
- local
- background
- foreground
surfaces:
- blender
- service
modes:
- apply
inputs:
  code:
    type: string
    default: ''
    description: 待执行的 Python 代码字符串
  description:
    type: string
    default: ''
    description: 代码用途描述（用于审计日志）
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 在 Blender Python 环境中执行任意代码并返回结果。支持后台无头模式和当前 Blender 界面前台模式；代码中将结果赋值给 result 变量。
  usage: execute_api(blender.asset.blender_exec_code, params={...})
  scenario: 在 Blender Python 环境中执行任意代码并返回结果。支持后台无头模式和当前 Blender 界面前台模式；代码中将结果赋值给 result 变量。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation:
  status: implemented
verification:
  level: live_tested
  evidence:
  - audit/api-c03eac327d4c.json
  - audit/chain-615cf0b7.json
handler: cgi_pipeline.capabilities.blender.asset.blender_exec_code.adapter:execute
