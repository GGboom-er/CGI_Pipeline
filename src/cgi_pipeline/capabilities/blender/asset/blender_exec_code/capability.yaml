api_id: blender.asset.blender_exec_code
version: 1.0.0
name: Blender 动态代码执行
executor: blender
capability: runtime.code
operation: execute
stages:
- modeling
- rigging
- animation
targets:
- host_runtime
access: destructive
effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
execution_modes:
- local
- background
- foreground
surfaces:
- blender
- service
modes:
- apply
inputs:
  code:
    type: string
    default: ''
    description: 待执行的 Python 代码字符串
  description:
    type: string
    default: ''
    description: 代码用途描述（用于审计日志）
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
- name: blend
  type: blend_file
  label: 处理后 .blend
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 在 Blender Python 环境中执行任意代码并返回结果。支持后台无头模式和当前 Blender 界面前台模式；代码中将结果赋值给 result 变量。
  usage: execute_api(blender.asset.blender_exec_code, params={...})
  scenario: 在 Blender Python 环境中执行任意代码并返回结果。支持后台无头模式和当前 Blender 界面前台模式；代码中将结果赋值给 result 变量。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: cgi_pipeline.capabilities.blender.asset.blender_exec_code.adapter:execute
