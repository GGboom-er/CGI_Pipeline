api_id: blender.scene.selection.set
version: 1.0.1
name: selection_set
executor: blender
capability: scene.selection
operation: set
stages: [modeling, rigging, animation]
targets: [selection]
access: write
effects:
  scene_write: Changes selected and optionally active objects.
execution_modes: [local, foreground]
surfaces: [blender, service]
modes: [apply]
inputs:
  nodes: {type: array, default: [], description: Object names.}
  active: {type: string, default: '', description: Optional active object.}
  mode: {type: string, default: replace, choices: [replace, add, remove, clear], description: Selection edit mode.}
  max_items: {type: integer, default: 200, description: Maximum input objects; hard limit 2000.}
preconditions: [Objects are in the active view layer.]
idempotent: true
outputs:
  before: Prior selection.
  after: Resulting selection.
  status: Operation result status inside output; distinct from the API receipt status.
  truncated: Whether input exceeded max_items.
statuses: [SUCCESS, ERROR]
errors: {BLENDER_SCENE_CORE_OPERATION_FAILED: Invalid object mode or context.}
recovery: [Correct object names or selection mode.]
help: {summary: Set Blender selection without UI operators., usage: "execute_api(blender.scene.selection.set, params={nodes, mode, active})", scenario: Establish context for later operations., safety: Changes interactive selection only.}
tests: {contract: tests/test_blender_scene_core_apis.py}
handler: cgi_pipeline.capabilities.blender.scene_core:set_selection
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_blender_scene_core_apis.py]}
