api_id: blender.scene.transforms.get
version: 1.0.1
name: transforms_get
executor: blender
capability: scene.transforms
operation: query
stages: [modeling, rigging, animation]
targets: [transform]
access: read
effects:
  scene_read: Reads bounded local or world object transforms.
execution_modes: [local, foreground, background]
surfaces: [blender, service]
modes: [inspect]
inputs:
  nodes: {type: array, required: true, description: Object names.}
  space: {type: string, default: world, choices: [world, local], description: Transform space.}
  max_items: {type: integer, default: 200, description: Maximum objects; hard limit 2000.}
preconditions: [Objects exist.]
idempotent: true
outputs:
  items: Translation Euler rotation and scale by object.
  count: Number of returned or processed items for this action.
  succeeded: Number of successful per-item operations.
  failed: Number of failed per-item operations.
  truncated: Whether the operation reached its configured result or input bound.
statuses: [SUCCESS, PARTIAL, ERROR]
errors: {BLENDER_SCENE_CORE_OPERATION_FAILED: Invalid object space or context.}
recovery: [Correct object names or reduce max_items.]
help: {summary: Read many Blender object transforms., usage: "execute_api(blender.scene.transforms.get, params={nodes, space})", scenario: Sample scene transforms before edits., safety: Read-only and bounded.}
tests: {contract: tests/test_blender_scene_core_apis.py}
handler: cgi_pipeline.capabilities.blender.scene_core:get_transforms
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_blender_scene_core_apis.py]}
