api_id: blender.scene.hierarchy.inspect
version: 1.0.1
name: hierarchy_inspect
executor: blender
capability: scene.hierarchy
operation: inspect
stages: [modeling, rigging, animation]
targets: [scene_object]
access: read
effects:
  scene_read: Reads bounded object parent and child relationships.
execution_modes: [local, foreground, background]
surfaces: [blender, service]
modes: [inspect]
inputs:
  nodes: {type: array, required: true, description: Object names.}
  max_items: {type: integer, default: 200, description: Maximum objects and children per object; hard limit 2000.}
preconditions: [Objects exist.]
idempotent: true
outputs:
  items: Parent and bounded child names.
  count: Number of returned or processed items for this action.
  succeeded: Number of successful per-item operations.
  failed: Number of failed per-item operations.
  truncated: Whether the operation reached its configured result or input bound.
statuses: [SUCCESS, PARTIAL, ERROR]
errors: {BLENDER_SCENE_CORE_OPERATION_FAILED: Invalid object or Blender context.}
recovery: [Correct object names or reduce max_items.]
help: {summary: Inspect Blender object hierarchy., usage: "execute_api(blender.scene.hierarchy.inspect, params={nodes})", scenario: Read object relationships before parenting changes., safety: Read-only and bounded.}
tests: {contract: tests/test_blender_scene_core_apis.py}
handler: cgi_pipeline.capabilities.blender.scene_core:inspect_hierarchy
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_blender_scene_core_apis.py]}
