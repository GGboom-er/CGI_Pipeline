api_id: maya.rig.maya_clean_skinweights
version: 1.0.0
name: 清理蒙皮权重
executor: maya
capability: rigging.skin
operation: clean
stages:
- rigging
targets:
- skin_weights
access: destructive
effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  threshold:
    type: number
    default: 0.001
    description: 噪声阈值，低于此值的权重将被清零
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
- name: scene
  type: scene_file
  label: 处理后场景
- name: report
  type: report
  label: 清理报告 (.md)
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 移除蒙皮权重中的微量噪声（低于阈值），规范化权重总和为 1.0。需要提供包含蒙皮网格的源场景文件。
  usage: execute_api(maya.rig.maya_clean_skinweights, params={...})
  scenario: 移除蒙皮权重中的微量噪声（低于阈值），规范化权重总和为 1.0。需要提供包含蒙皮网格的源场景文件。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: cgi_pipeline.capabilities.maya.rig.maya_clean_skinweights.adapter:execute
