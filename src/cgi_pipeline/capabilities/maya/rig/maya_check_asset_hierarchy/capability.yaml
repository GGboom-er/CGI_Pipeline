api_id: maya.rig.maya_check_asset_hierarchy
version: 1.0.1
name: maya_check_rig_geometry_layout
executor: maya
capability: rigging.hierarchy
operation: inspect
stages:
- rigging
targets:
- hierarchy
- mesh
access: read
effects:
  file_read: Reads the project hierarchy configuration.
  scene_read: Reads hierarchy and reports candidate roots; its safe-delete helper only diagnoses, without deleting.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- inspect
inputs:
  stage:
    type: string
    default: rig
    description: 项目阶段。用于读取 config/{project}_config.json 中 stages[stage].geom_roots[0] 作为标准根。
  phase:
    type: string
    default: post_sync
    description: 检查阶段。pre_sync 要求存在可供同步读取的旧绑定几何根；post_sync 要求标准 cache 根存在并有 mesh。
  block_on_fail:
    type: boolean
    default: true
    description: 检查失败时是否返回 AUDIT_FAILED。false 时仍返回 SUCCESS，但 output.result.passed=false。
  block_extra_top_nodes:
    type: boolean
    default: false
    description: 是否把非空额外顶层节点作为阻断项。默认 false，仅输出风险事实，避免误阻断或误删绑定系统。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
  passed: 'Optional by action: passed returned by the source implementation.'
  code: 'Optional by action: code returned by the source implementation.'
  issue_count: 'Optional by action: issue count returned by the source implementation.'
  required_root: 'Optional by action: required root returned by the source implementation.'
  active_rig_root: 'Optional by action: active rig root returned by the source implementation.'
  cache_mesh_count: 'Optional by action: cache mesh count returned by the source implementation.'
  active_rig_mesh_count: 'Optional by action: active rig mesh count returned by the
    source implementation.'
  extra_top_nodes: 'Optional by action: extra top nodes returned by the source implementation.'
  manual_review_top_nodes: 'Optional by action: manual review top nodes returned by
    the source implementation.'
  legacy_geo_roots: 'Optional by action: legacy geo roots returned by the source implementation.'
  candidate_source_roots: 'Optional by action: candidate source roots returned by
    the source implementation.'
  issues: 'Optional by action: issues returned by the source implementation.'
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- AUDIT_FAILED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 纯 QC 检查：从项目配置读取当前 stage 的标准几何根，确认标准根存在、标准根下有有效 mesh，并输出层级修复节点需要消费的只读事实。
  usage: execute_api(maya.rig.maya_check_asset_hierarchy, params={...})
  scenario: 纯 QC 检查：从项目配置读取当前 stage 的标准几何根，确认标准根存在、标准根下有有效 mesh，并输出层级修复节点需要消费的只读事实。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_maya_rigging_contracts.py]}
handler: cgi_pipeline.capabilities.maya.rig.maya_check_asset_hierarchy.adapter:execute
