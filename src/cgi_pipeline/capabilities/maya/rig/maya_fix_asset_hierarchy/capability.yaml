api_id: maya.rig.maya_fix_asset_hierarchy
version: 1.0.1
name: maya_fix_rig_geometry_layout
executor: maya
capability: rigging.hierarchy
operation: fix
stages:
- rigging
targets:
- hierarchy
- mesh
access: destructive
effects:
  scene_read: Reads explicit hierarchy diagnostics and affected geometry.
  scene_write: Unlocks, creates or renames Group/Geometry/cache and reparents geometry; optional flags delete only checked
    empty source/top-level roots.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  check_result:
    type: object
    description: 必填；maya_check_asset_hierarchy 的 output.result。fix 只消费其中 required_root、legacy_geo_roots、candidate_source_roots、safe_delete_top_nodes。workflow 模板中写 {{outputs.check_hierarchy_pre.result}}。
    required: true
  remove_empty_source:
    type: boolean
    default: true
    description: 迁移后是否删除已经为空的源 cache 根。
  delete_extra_top_nodes:
    type: boolean
    default: false
    description: 是否删除检查结果标记为 safe_delete_top_nodes 的空顶层节点；非空业务根永不自动删除。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  scene: Current Maya scene path from the independent XGen source.
  active_rig_root: 'Optional by action: active rig root returned by the source implementation.'
  required_root: 'Optional by action: required root returned by the source implementation.'
  renamed_top_count: 'Optional by action: renamed top count returned by the source
    implementation.'
  created_group_count: 'Optional by action: created group count returned by the source
    implementation.'
  deleted_top_node_count: 'Optional by action: deleted top node count returned by
    the source implementation.'
  moved_child_count: 'Optional by action: moved child count returned by the source
    implementation.'
  renamed_tops: 'Optional by action: renamed tops returned by the source implementation.'
  normalized_rig_roots: 'Optional by action: normalized rig roots returned by the
    source implementation.'
  created_groups: 'Optional by action: created groups returned by the source implementation.'
  moved_children: 'Optional by action: moved children returned by the source implementation.'
  deleted_top_nodes: 'Optional by action: deleted top nodes returned by the source
    implementation.'
  removed_empty_sources: 'Optional by action: removed empty sources returned by the
    source implementation.'
  preserved_top_nodes: 'Optional by action: preserved top nodes returned by the source
    implementation.'
  manual_review_top_nodes: 'Optional by action: manual review top nodes returned by
    the source implementation.'
  result: Underlying operation result; its internal fields belong to that operation.
  rolled_back: 'Optional by action: rolled back returned by the source implementation.'
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 消费 maya_check_asset_hierarchy 的检查结果，按检查结果把旧绑定几何根归一化为 |Group|Geometry|RIG_geo，并只删除安全空顶层节点。
  usage: execute_api(maya.rig.maya_fix_asset_hierarchy, params={...})
  scenario: 消费 maya_check_asset_hierarchy 的检查结果，按检查结果把旧绑定几何根归一化为 |Group|Geometry|RIG_geo，并只删除安全空顶层节点。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_maya_rigging_contracts.py]}
handler: cgi_pipeline.capabilities.maya.rig.maya_fix_asset_hierarchy.adapter:execute
