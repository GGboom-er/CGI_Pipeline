api_id: maya.animation.expressions.manage
version: 1.0.1
executor: maya
capability: animation.expressions
operation: manage
stages: [rigging, animation]
targets: [expression, attribute]
access: destructive
effects:
  scene_read: 'action=list: Reads bounded Maya expression nodes.'
  scene_write: 'action=create: Creates one generated linear-assignment expression. action=update: Replaces one expression
    with generated linear assignments. action=delete: Deletes explicit expression nodes.'
execution_modes: [local, foreground, background]
surfaces: [maya, service]
modes: [inspect, apply]
mode_binding:
  input: action
  cases:
  - value: list
    mode: inspect
  - value: create
    mode: apply
  - value: update
    mode: apply
  - value: delete
    mode: apply
inputs:
  action: {type: string, required: true, choices: [list, create, update, delete], description: "Expression management action."}
  name: {type: string, default: "", description: "New expression node name for create."}
  expression_node: {type: string, default: "", description: "Explicit expression node for update."}
  expression_nodes: {type: array, default: [], description: "Explicit expression nodes for delete."}
  assignments: {type: array, default: [], description: "Generated linear assignments with target and exactly one source or value plus optional multiplier and offset."}
  always_evaluate: {type: boolean, default: true, description: "Maya alwaysEvaluate setting for create or update."}
  unit_conversion: {type: string, default: all, choices: [all, angularOnly, none], description: "Maya expression unit-conversion setting."}
  max_items: {type: integer, default: 200, description: "Maximum assignments, listed nodes or deleted nodes; hard limit 2000."}
preconditions: [Node and plug names must resolve unambiguously., Assignments are generated by this API; arbitrary expression source is not accepted.]
idempotent: false
outputs:
  action: Executed action.
  items: Listed or deleted expression nodes.
  count: Number of returned or processed items for this action.
  returned_count: Number of visible items after applying the result bound.
  truncated: Whether the operation reached its configured result or input bound.
  assignments: Canonical generated assignments.
  expression_node: 'Optional by action: expression node returned by the source implementation.'
  expression: Maya-normalized expression source.
  always_evaluate: 'Optional by action: always evaluate returned by the source implementation.'
  unit_conversion: 'Optional by action: unit conversion returned by the source implementation.'
  before: 'Optional by action: before returned by the source implementation.'
statuses: [SUCCESS, ERROR]
errors: {MAYA_ANIMATION_OPERATION_FAILED: "Expression validation, mutation or readback failed."}
recovery: [Correct long paths and assignment declarations; failed mutations roll back one Maya undo chunk.]
help: {summary: "List, create, update or delete bounded Maya expressions through generated linear assignments.", usage: "execute_api(maya.animation.expressions.manage, params={action, assignments})", scenario: "Build simple controller-to-attribute expression relationships without arbitrary host code.", safety: "Does not accept raw expression source, MEL, Python or backtick execution; writes use one undo chunk."}
tests: {contract: tests/test_maya_animation_expressions_poses.py, smoke: "Foreground create, update and reversible delete."}
implementation: {status: implemented, module: maya.animation.expressions_manage.core:execute}
verification: {level: contract_tested, evidence: [tests/test_maya_animation_expressions_poses.py]}
handler: cgi_pipeline.capabilities.maya.animation.expressions_manage.core:execute
