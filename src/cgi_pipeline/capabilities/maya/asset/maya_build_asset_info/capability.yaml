api_id: maya.asset.maya_build_asset_info
version: 1.0.0
name: Maya 资产信息采集
executor: maya
capability: asset.metadata
operation: build
stages:
- modeling
targets:
- asset
- mesh
access: read
effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- inspect
inputs:
  info_path:
    type: string
    default: ''
    description: _info.json 输出完整路径。workflow 中必须传入任务沙盒 .info 路径；为空时从任务沙盒自动推导。
  cache_group:
    type: string
    description: 必填。要采集的 Maya 几何根组，由项目配置或 workflow 传入。
    required: true
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
- name: info
  type: json_file
  label: _info.json
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 遍历指定 Maya 几何根组下所有 mesh，从 Maya 图关系求出的原始几何采集拓扑指纹（顶点数+世界空间坐标），输出标准 _info.json。只负责几何信息，不采集贴图或面级材质。
  usage: execute_api(maya.asset.maya_build_asset_info, params={...})
  scenario: 遍历指定 Maya 几何根组下所有 mesh，从 Maya 图关系求出的原始几何采集拓扑指纹（顶点数+世界空间坐标），输出标准 _info.json。只负责几何信息，不采集贴图或面级材质。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: cgi_pipeline.capabilities.maya.asset.maya_build_asset_info.adapter:execute
