api_id: maya.asset.rename_asset
version: 1.0.1
name: 标准化资产重命名
executor: maya
capability: scene.file
operation: rename
stages:
- pipeline
targets:
- asset
- scene_file
access: write
effects:
  file_write: Creates the destination directory and saves the scene under the requested new name.
  host_state_write: Changes the current scene filename.
  file_read: With a current scene available, resolves project naming rules through load_project_config; a cache miss reads the project configuration JSON.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  project:
    type: string
    default: ''
    description: 项目代号，为空则从数据流推断
  category:
    type: string
    default: ''
    description: 资产分类，为空则从数据流推断
  asset_name:
    type: string
    default: ''
    description: 资产名称，为空则从数据流推断
  stage:
    type: string
    default: ''
    description: 制作阶段，为空则从数据流推断
  task:
    type: string
    default: ''
    description: 子任务名（可选）
  output_dir:
    type: string
    default: ''
    description: 输出目录（可选，默认与源文件同目录）
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: '将当前场景按管线命名规范重命名并另存为。格式: {project}_{category}_{asset}_{stage}_{task}_v{version}.ma。不修改场景内容。'
  usage: execute_api(maya.asset.rename_asset, params={...})
  scenario: '将当前场景按管线命名规范重命名并另存为。格式: {project}_{category}_{asset}_{stage}_{task}_v{version}.ma。不修改场景内容。'
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: rename_asset.rename_asset}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_high_value_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.rename_asset.adapter:execute
