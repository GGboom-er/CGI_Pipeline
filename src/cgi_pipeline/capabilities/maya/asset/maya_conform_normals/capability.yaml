api_id: maya.asset.maya_conform_normals
version: 1.0.1
name: 统一法线并清零顶点偏移
executor: maya
capability: modeling.geometry
operation: conform
stages:
- modeling
targets:
- mesh
- normal
access: destructive
effects:
  scene_read: Reads explicit mesh shapes.
  scene_write: Changes shape normals with constructionHistory disabled.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  geo_group:
    type: string
    default: ''
    description: 目标组名（默认自动查找 geo/Group/cache）
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 对 cache/geo 组内所有 mesh 执行 polyNormal conform（normalMode=2, userNormalMode=0, ch=0），统一法线方向并清除顶点局部空间的 pnts 偏移值。
  usage: execute_api(maya.asset.maya_conform_normals, params={...})
  scenario: 对 cache/geo 组内所有 mesh 执行 polyNormal conform（normalMode=2, userNormalMode=0, ch=0），统一法线方向并清除顶点局部空间的 pnts 偏移值。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_conform_normals.maya_conform_normals}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_conform_normals.adapter:execute
