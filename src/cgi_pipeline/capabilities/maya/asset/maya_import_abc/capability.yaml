api_id: maya.asset.maya_import_abc
version: 1.0.1
name: 导入 ABC 缓存
executor: maya
capability: asset.exchange
operation: import
stages:
- modeling
- rigging
- animation
targets:
- asset
- alembic
access: write
effects:
  file_read: Reads the supplied Alembic archive.
  scene_write: new_scene=true force-creates a scene; imports geometry, scales roots and freezes transforms.
  host_state_write: Loads the AbcImport plugin when needed.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  abc_path:
    type: string
    default: ''
    description: ABC 文件的完整路径（必填）
  scale_factor:
    type: number
    default: 100.0
    description: 导入后缩放系数，0 表示不缩放
  new_scene:
    type: boolean
    default: true
    description: 是否先新建空场景再导入
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  output_path: Input Alembic path that was imported; this is not a saved Maya scene.
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 将 Alembic (.abc) 文件导入 Maya 场景，支持坐标系缩放对齐（默认 100x Blender→Maya）并冻结变换。
  usage: execute_api(maya.asset.maya_import_abc, params={...})
  scenario: 将 Alembic (.abc) 文件导入 Maya 场景，支持坐标系缩放对齐（默认 100x Blender→Maya）并冻结变换。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_import_abc.maya_import_abc}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_import_abc.adapter:execute
