api_id: maya.asset.maya_compare_asset_in_scene
version: 1.0.2
name: maya_compare_abc_to_scene_geometry
executor: maya
capability: asset.compare
operation: compare
stages:
- modeling
- rigging
targets:
- asset
- mesh
access: write
effects:
  scene_read: Compares source metadata with current scene geometry.
  file_read: Reads source metadata and archive inputs.
  scene_write: When nonrig_meshes are found, creates the persistent NoneRig display layer and adds those members.
  file_write: Writes compare_result.json.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- inspect
inputs:
  input_source:
    type: string
    default: ''
    description: source 侧 ABC 或 _info.json。workflow 传 blender_export_abc 的 output_path。
  cache_group:
    type: string
    description: 必填。当前 Maya target rig 场景中的几何根组，由项目配置或 workflow 传入。
    required: true
  output_path:
    type: string
    default: ''
    description: compare_result.json 输出路径。为空时从任务沙盒 .info 自动推导。
  label_source:
    type: string
    default: ''
    description: source 标签，空值时从输入路径自动推断。
  label_target:
    type: string
    default: rig
    description: target 标签，默认 rig。
preconditions:
- ABC 使用轻量点位读取；只比较既有几何标准，不检查法线或 UV。有限仿射镜像和零缩放可比较，非有限点或非仿射矩阵拒绝。
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  matched_total: 'Optional by action: matched total returned by the source implementation.'
  matched_same: 'Optional by action: matched same returned by the source implementation.'
  matched_different: 'Optional by action: matched different returned by the source
    implementation.'
  only_source: 'Optional by action: only source returned by the source implementation.'
  only_target: 'Optional by action: only target returned by the source implementation.'
  blocking: 'Optional by action: blocking returned by the source implementation.'
  nonrig_count: 'Optional by action: nonrig count returned by the source implementation.'
  nonrig_meshes: 'Optional by action: nonrig meshes returned by the source implementation.'
  compare_result: 'Optional by action: compare result returned by the source implementation.'
  action_counts: 'Optional by action: action counts returned by the source implementation.'
  compare_sources: 'Optional by action: compare sources returned by the source implementation.'
  matched_same_items: 'Optional by action: matched same items returned by the source
    implementation.'
  matched_different_items: 'Optional by action: matched different items returned by
    the source implementation.'
  only_source_items: 'Optional by action: only source items returned by the source
    implementation.'
  only_target_items: 'Optional by action: only target items returned by the source
    implementation.'
  hierarchy_match: 'Optional by action: hierarchy match returned by the source implementation.'
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 在当前已打开的 target rig Maya 场景内采集指定 cache_group 的 ShapeOrig 几何信息，读取 source 侧 ABC 或 _info.json，调用统一 compare 算法并写出 compare_result.json。用于只看差异或为后续 maya_sync_rig_incremental 提供拼装决策。
  usage: execute_api(maya.asset.maya_compare_asset_in_scene, params={...})
  scenario: 在当前已打开的 target rig Maya 场景内采集指定 cache_group 的 ShapeOrig 几何信息，读取 source 侧 ABC 或 _info.json，调用统一 compare 算法并写出 compare_result.json。用于只看差异或为后续 maya_sync_rig_incremental 提供拼装决策。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_compare_asset_in_scene.maya_compare_asset_in_scene}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_compare_asset_in_scene.adapter:execute
