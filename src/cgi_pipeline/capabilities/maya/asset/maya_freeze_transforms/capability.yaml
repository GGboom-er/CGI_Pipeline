api_id: maya.asset.maya_freeze_transforms
version: 1.0.1
name: 冻结变换
executor: maya
capability: scene.edit
operation: freeze
stages:
- modeling
- rigging
targets:
- transform
access: destructive
effects:
  scene_read: Reads the affected mesh transforms.
  scene_write: May force-open source_path; freezes transforms and deletes history without saving the scene.
  file_read: When context.source_path is non-empty, force-opens and reads that Maya scene file before freezing transforms.
  host_state_write: When context.source_path is non-empty, replaces the current scene and filename with force=True, which can discard unsaved scene changes.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  target_nodes:
    type: array
    default: []
    description: 指定节点列表，为空则作用于所有 mesh/transform
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 冻结场景中所有可变换节点的 Translate/Rotate/Scale，并清除构造历史。
  usage: execute_api(maya.asset.maya_freeze_transforms, params={...})
  scenario: 冻结场景中所有可变换节点的 Translate/Rotate/Scale，并清除构造历史。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_freeze_transforms.maya_freeze_transforms}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_high_value_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_freeze_transforms.adapter:execute
