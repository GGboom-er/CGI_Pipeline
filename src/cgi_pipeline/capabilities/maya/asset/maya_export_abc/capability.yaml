api_id: maya.asset.maya_export_abc
version: 1.0.1
name: Maya 导出 ABC
executor: maya
capability: asset.exchange
operation: export
stages:
- modeling
- rigging
- animation
targets:
- asset
- alembic
access: write
effects:
  scene_read: Reads the explicit export scope.
  host_state_write: Loads the AbcExport plugin when needed.
  file_write: Writes the requested Alembic archive.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  abc_path:
    type: string
    default: ''
    description: ABC 输出完整路径。workflow 中必须传入任务沙盒 .info 路径；为空时从任务沙盒自动推导。
  frame_range:
    type: array
    default:
    - 1
    - 1
    description: 导出帧范围 [start, end]
  root_nodes:
    type: string
    default: ''
    description: 要导出的根节点列表。为空则导出全部顶层。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 将当前 Maya 场景导出为 Alembic (.abc)，含 UV、FaceSet、可见性，Ogawa 格式。不保留 skinCluster。
  usage: execute_api(maya.asset.maya_export_abc, params={...})
  scenario: 将当前 Maya 场景导出为 Alembic (.abc)，含 UV、FaceSet、可见性，Ogawa 格式。不保留 skinCluster。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_export_abc.maya_export_abc}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_export_abc.adapter:execute
