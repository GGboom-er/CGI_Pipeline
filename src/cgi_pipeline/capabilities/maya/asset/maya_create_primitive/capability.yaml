api_id: maya.asset.maya_create_primitive
version: 1.0.1
name: maya_create_primitive
executor: maya
capability: modeling.geometry
operation: create
stages:
- modeling
targets:
- mesh
access: write
effects:
  scene_write: Creates one of the six supported polygon primitive types.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  primitive_type: {type: string, default: cube, choices: [cube, sphere, cylinder, cone, plane, torus], description: "要创建的多边形原语类型。"}
  name: {type: string, default: primitive, description: "目标 transform 名称。"}
  parent: {type: string, default: "", description: "可选父节点长路径。"}
  size: {type: number, default: 1.0, description: "立方体边长。"}
  radius: {type: number, default: 1.0, description: "球体、圆柱、圆锥或圆环半径。"}
  height: {type: number, default: 2.0, description: "圆柱或圆锥高度。"}
  width: {type: number, default: 1.0, description: "平面宽度。"}
  major_radius: {type: number, default: 1.0, description: "圆环主半径。"}
  minor_radius: {type: number, default: 0.25, description: "圆环副半径。"}
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  transform: 'Optional by action: transform returned by the source implementation.'
  shapes: 'Optional by action: shapes returned by the source implementation.'
  primitive_type: 'Optional by action: primitive type returned by the source implementation.'
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 在当前 Maya 场景创建一个受参数约束的多边形原语并返回长路径。
  usage: "execute_api(maya.asset.maya_create_primitive, params={primitive_type: cube, name: probe})"
  scenario: 场景搭建、API smoke 或 workflow 的几何起点。
  safety: 写入当前任务沙盒中的 Maya 场景；不覆盖已有节点，失败返回 ERROR。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_create_primitive.maya_create_primitive}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_apis.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_create_primitive.adapter:execute
