api_id: maya.asset.maya_master_cleanup
version: 1.1.0
name: 管线全自动清理与优化
executor: maya
capability: scene.cleanup
operation: clean
stages:
- modeling
- rigging
- animation
targets:
- scene
access: destructive
effects:
  scene_read: mode=check or fix scans project scene quality.
  scene_write: mode=check can change currentUVSet without restoration; mode=fix deletes supported residual nodes, cameras,
    keys and UV data and runs native cleanup. The native deletion set is not statically exhaustive.
  host_state_write: mode=fix changes cleanup optionVars and calls native host cleanup commands; results are returned in the receipt. This API does not save the scene or write a separate Markdown report.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- inspect
- apply
mode_binding:
  input: mode
  cases:
  - value: check
    mode: inspect
  - value: fix
    mode: apply
inputs:
  profile:
    type: string
    default: master
    choices: [master, proxy_authoring]
    description: proxy_authoring only lists/removes existing ngSkinTools authoring data; skips all Master cleanup, UV, camera and animation operations. Current native skin weights remain the runtime binding.
  mode:
    type: string
    default: check
    choices:
    - check
    - fix
    description: check 返回诊断；检查可切换 currentUVSet 且当前未恢复。fix 执行清理；本 API 不保存场景。
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  report: output.report 为结构化检查或清理结果，报告随 receipt 返回，不另写 Markdown 文件。
  summary: output.summary 为操作摘要。
  items: output.items 为逐项检查或清理结果。
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- AUDIT_FAILED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 基于管线项目上下文，扫描或清理未知节点、插件残留、野生相机、多余UV集、死动画帧与空骨骼权重。支持 Check（诊断，可能切换当前 UV 集）和 Fix（执行清理）两种模式；均不保存场景。
  usage: execute_api(maya.asset.maya_master_cleanup, params={...})
  scenario: 基于管线项目上下文，扫描或清理未知节点、插件残留、野生相机、多余UV集、死动画帧与空骨骼权重。支持 Check（诊断，可能切换当前 UV 集）和 Fix（执行清理）两种模式；均不保存场景。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_master_cleanup.maya_master_cleanup}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_high_value_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_master_cleanup.adapter:execute
