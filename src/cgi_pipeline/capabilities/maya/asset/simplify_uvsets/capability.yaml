api_id: maya.asset.simplify_uvsets
version: 1.0.1
name: UV Set 精简
executor: maya
capability: modeling.uv
operation: simplify
stages:
- modeling
- rigging
targets:
- mesh
- uv_set
access: destructive
effects:
  scene_write: Consolidates UV data into map1, reinjects mesh data, cleans pnts/ghost data and synchronizes currentUVSet.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  cache_group:
    type: string
    default: cache
    description: 操作的根组名称，默认 cache
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 清理多余 UV set。对 cache 组下每个 mesh（支持绑定体 ShapeOrig 与普通体 Shape）执行直捷 UV 规整，拷贝/覆盖有效数据到 index 0 并删去其余废弃集，确保最终只保留一个名为 map1 的 UV set。破坏性操作，已包裹 undo 块。建议先用 check_uvsets 查看再执行。
  usage: execute_api(maya.asset.simplify_uvsets, params={...})
  scenario: 清理多余 UV set。对 cache 组下每个 mesh（支持绑定体 ShapeOrig 与普通体 Shape）执行直捷 UV 规整，拷贝/覆盖有效数据到 index 0 并删去其余废弃集，确保最终只保留一个名为 map1 的 UV set。破坏性操作，已包裹 undo 块。建议先用 check_uvsets 查看再执行。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: simplify_uvsets.simplify_uvsets}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.simplify_uvsets.adapter:execute
