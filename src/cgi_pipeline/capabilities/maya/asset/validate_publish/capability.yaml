api_id: maya.asset.validate_publish
version: 1.0.0
name: 发布前质量门禁
executor: maya
capability: pipeline.quality
operation: validate
stages:
- pipeline
targets:
- asset
- scene
access: read
effects:
  inspect: 只读取场景或标准数据，不改变资产。
  apply: 按 API 实现对当前任务沙盒中的场景或数据执行操作。
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- inspect
inputs:
  project:
    type: string
    default: ''
    description: 项目代号，为空则从数据流推断
  category:
    type: string
    default: ''
    description: 资产分类，为空则从数据流推断
  asset_name:
    type: string
    default: ''
    description: 资产名称，为空则从数据流推断
  stage:
    type: string
    default: ''
    description: 制作阶段，为空则从数据流推断
  cache_group:
    type: string
    default: ''
    description: cache 组名称，为空则自动查找
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
- name: scene
  type: scene_file
  label: 检查后场景
- name: report
  type: report
  label: QC 报告 (.md)
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 发布前自动化 QC 检查：验证场景完整性、cache 组存在性、mesh 数量、未知节点、空组、命名规范。只读操作，输出 PASS/FAIL 报告。
  usage: execute_api(maya.asset.validate_publish, params={...})
  scenario: 发布前自动化 QC 检查：验证场景完整性、cache 组存在性、mesh 数量、未知节点、空组、命名规范。只读操作，输出 PASS/FAIL 报告。
  safety: read API 只读；write/destructive API 仅写入任务沙盒。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
handler: cgi_pipeline.capabilities.maya.asset.validate_publish.adapter:execute
