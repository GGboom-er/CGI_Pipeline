api_id: maya.asset.validate_publish
version: 1.0.1
name: 发布前质量门禁
executor: maya
capability: pipeline.quality
operation: validate
stages:
- pipeline
targets:
- asset
- scene
access: write
effects:
  scene_read: Reads the publishing validation scope.
  file_write: Writes the independent business Markdown quality report.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- inspect
inputs:
  project:
    type: string
    default: ''
    description: 项目代号，为空则从数据流推断
  category:
    type: string
    default: ''
    description: 资产分类，为空则从数据流推断
  asset_name:
    type: string
    default: ''
    description: 资产名称，为空则从数据流推断
  stage:
    type: string
    default: ''
    description: 制作阶段，为空则从数据流推断
  cache_group:
    type: string
    default: ''
    description: cache 组名称，为空则自动查找
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
  report_path: 'Optional by action: report path returned by the source implementation.'
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- AUDIT_FAILED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 发布前自动化 QC 检查：验证场景完整性、cache 组存在性、mesh 数量、未知节点、空组、命名规范。只读操作，输出 PASS/FAIL 报告。
  usage: execute_api(maya.asset.validate_publish, params={...})
  scenario: 发布前自动化 QC 检查：验证场景完整性、cache 组存在性、mesh 数量、未知节点、空组、命名规范。只读操作，输出 PASS/FAIL 报告。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: validate_publish.validate_publish}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_high_value_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.validate_publish.adapter:execute
