api_id: maya.asset.maya_apply_materials
version: 1.0.1
name: maya_apply_materials_to_cache
executor: maya
capability: lookdev.material
operation: apply
stages:
- lookdev
targets:
- material
- mesh
access: write
effects:
  file_read: Reads the supplied materials JSON.
  scene_read: Reads mesh/material assignments and existing shading networks.
  scene_write: Creates shader, shading-group, file, UV and reverse networks; resets face assignments and removes obsolete
    groupId, empty shading groups and unused material nodes.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  materials_path:
    type: string
    default: ''
    description: _materials.json 文件路径（必填）
  target_group:
    type: string
    default: ''
    description: 限定处理范围的组名，为空则处理全场景
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: false
outputs:
  materials_path: 'Optional by action: materials path returned by the source implementation.'
  target_group: 'Optional by action: target group returned by the source implementation.'
  material_count: 'Optional by action: material count returned by the source implementation.'
  material_names: 'Optional by action: material names returned by the source implementation.'
  assigned_mesh_count: 'Optional by action: assigned mesh count returned by the source
    implementation.'
  assigned_meshes: 'Optional by action: assigned meshes returned by the source implementation.'
  assignment_count: 'Optional by action: assignment count returned by the source implementation.'
  failed_count: 'Optional by action: failed count returned by the source implementation.'
  failed_assignments: 'Optional by action: failed assignments returned by the source
    implementation.'
  removed_old_sg_count: 'Optional by action: removed old sg count returned by the
    source implementation.'
  removed_old_node_count: 'Optional by action: removed old node count returned by
    the source implementation.'
  shared_old_sg_count: 'Optional by action: shared old sg count returned by the source
    implementation.'
  removed_old_sgs: 'Optional by action: removed old sgs returned by the source implementation.'
  shared_old_sgs: 'Optional by action: shared old sgs returned by the source implementation.'
  approximation_count: 'Optional by action: approximation count returned by the source
    implementation.'
  approximation_items: 'Optional by action: approximation items returned by the source
    implementation.'
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 消费 blender_extract_materials 导出的 schema v3 Color/Alpha _materials.json，为 Maya 场景中的 mesh 按面新建共享 lambert 材质球并赋予。
  usage: execute_api(maya.asset.maya_apply_materials, params={...})
  scenario: 消费 blender_extract_materials 导出的 schema v3 Color/Alpha _materials.json，为 Maya 场景中的 mesh 按面新建共享 lambert 材质球并赋予。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_apply_materials.maya_apply_materials}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_apply_materials.adapter:execute
