api_id: maya.asset.maya_build_mesh_from_abc
version: 1.0.3
name: PyAlembic → Maya Mesh 构建
executor: maya
capability: modeling.geometry
operation: build
stages:
- modeling
- rigging
targets:
- mesh
- alembic
access: write
effects:
  file_read: Reads the supplied Alembic archive.
  scene_write: Creates and names meshes and DAG hierarchy and assigns the default shading group; no atomic rollback guarantee.
execution_modes:
- local
- background
- foreground
surfaces:
- maya
- service
modes:
- apply
inputs:
  abc_path:
    type: string
    default: ''
    description: ABC 文件绝对路径（必填）
  mesh_filter:
    type: array
    default: []
    description: DAG 路径列表，只构建匹配项。不传 = 全量构建
  parent_group:
    type: string
    default: ''
    description: 构建后的新顶层根。若 ABC 路径已有同名根，仅保留该根以下层级；为空则还原原始层级
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
- 完整几何在创建层级前校验；有效来源角点法线为权威，已提供但损坏或不支持 scope 的法线不会降级为自动法线。
- 负行列式、奇异或非仿射来源变换明确拒绝；本能力不猜测外侧、不执行射线阈值翻面。
idempotent: false
outputs:
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
- 执行失败可能留下部分构建结果；从干净场景重跑，不把异常结果保存为成功交付。
help:
  summary: 使用 PyAlembic 读取 ABC，在 Maya 中构建完整拓扑、UV 与变换到正确空间的作者角点法线，还原 DAG 层级。仅合法缺失法线允许 Maya 生成；必要写入失败报错。支持全量构建和 mesh_filter。
  usage: execute_api(maya.asset.maya_build_mesh_from_abc, params={...})
  scenario: 使用 PyAlembic 读取 ABC 拓扑数据，在 Maya 中用 OpenMaya MFnMesh.create 纯数据构建 mesh（含 UV），还原 DAG 层级。不走 Maya import 命令。支持全量构建和按 mesh_filter 过滤构建。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation: {status: implemented, module: maya_build_mesh_from_abc.maya_build_mesh_from_abc}
verification: {level: contract_tested, evidence: [tests/test_maya_asset_remaining_contracts.py, tests/test_maya_normal_writers.py, tests/test_abc_normals.py]}
handler: cgi_pipeline.capabilities.maya.asset.maya_build_mesh_from_abc.adapter:execute
