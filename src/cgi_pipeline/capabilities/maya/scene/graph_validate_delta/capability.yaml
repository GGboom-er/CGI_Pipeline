recovery: [Recreate both snapshots with graph.snapshot_bounded.]
help: {summary: Validate the delta between two Maya graph snapshots., usage: "execute_api(maya.scene.graph.validate_delta, params={before, after})", scenario: Verify an MFace graph edit changed only intended nodes and edges., safety: Read-only comparison.}
tests: {contract: tests/test_scene_batch_apis.py, smoke: Compare two bounded snapshots.}
implementation: {status: implemented, module: maya.scene_batch:validate_graph_delta}
verification: {level: contract_tested, evidence: [tests/test_scene_batch_apis.py]}
