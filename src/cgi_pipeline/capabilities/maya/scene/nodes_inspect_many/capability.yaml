api_id: maya.scene.nodes.inspect_many
version: 1.0.2
name: nodes_inspect_many
executor: maya
capability: scene.nodes
operation: inspect
stages: [modeling, rigging, animation]
targets: [scene_object]
access: read
effects:
  scene_read: Reads bounded Maya node identity and type metadata.
execution_modes: [local, foreground, background]
surfaces: [maya, service]
modes: [inspect]
inputs:
  nodes: {type: array, required: true, description: Node names or patterns.}
