statuses: [SUCCESS, ERROR]
errors: {MAYA_BATCH_OPERATION_FAILED: Invalid node query or Maya context.}
recovery: [Reduce max_nodes or correct node patterns.]
help: {summary: Inspect many Maya nodes in one main-thread call., usage: "execute_api(maya.scene.nodes.inspect_many, params={nodes})", scenario: Bounded rig-node discovery., safety: Read-only and bounded.}
tests: {contract: tests/test_scene_batch_apis.py, smoke: Foreground Maya bounded query.}
