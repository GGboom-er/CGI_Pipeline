api_id: pipeline.pipeline.copy_files
version: 1.0.1
name: pipeline_stage_file_to_sandbox
executor: pipeline
capability: pipeline.file
operation: copy
stages:
- pipeline
targets:
- file
access: write
effects:
  file_read: Reads source files and directory contents.
  file_write: Creates destination directories and copies files recursively; overwrite controls skip or replacement.
execution_modes:
- background
surfaces:
- python
- service
modes:
- apply
inputs:
  source:
    type: string
    default: ''
    description: 源路径（文件或目录的完整路径）
  destination:
    type: string
    default: ''
    description: 目标路径（文件或目录的完整路径）
  overwrite:
    type: boolean
    default: false
    description: 目标已存在时是否覆盖
preconditions:
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 纯文件系统操作；无需 Maya、Blender 或其他 DCC 场景，不启动 DCC 后台。
idempotent: false
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  result: Underlying operation result; its internal fields belong to that operation.
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 通用文件拷贝：source → destination，文件或目录均可。纯文件系统操作，不启动任何 DCC。
  usage: execute_api(pipeline.pipeline.copy_files, params={...})
  scenario: 通用文件拷贝：source → destination，文件或目录均可。纯文件系统操作，不启动任何 DCC。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation:
  status: implemented
verification:
  level: live_tested
  evidence:
  - audit/api-e88b16f47cda.json
handler: cgi_pipeline.capabilities.pipeline.pipeline.copy_files.adapter:execute
