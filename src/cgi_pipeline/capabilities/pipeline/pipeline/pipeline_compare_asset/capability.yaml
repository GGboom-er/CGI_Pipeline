api_id: pipeline.pipeline.pipeline_compare_asset
version: 1.0.2
name: 资产对比（统一入口）
executor: pipeline
capability: asset.compare
operation: compare
stages:
- pipeline
targets:
- asset
- metadata
access: write
effects:
  file_read: Reads both asset-info files and Alembic sources.
  file_write: Writes compare_result.json; the report body is returned in the receipt.
execution_modes:
- background
surfaces:
- python
- service
modes:
- inspect
inputs:
  input_source:
    type: string
    default: ''
    description: source 侧 _info.json 或 .abc 路径
  input_target:
    type: string
    default: ''
    description: target 侧 _info.json 或 .abc 路径
  label_source:
    type: string
    default: ''
    description: 'source 标签（自动推断: rig/tex/uv/model/anim 等）'
  label_target:
    type: string
    default: ''
    description: target 标签
  output_path:
    type: string
    default: ''
    description: compare_result.json 输出路径。workflow/单API调用必须传入任务沙盒 .info 路径或可推导 info_dir。
preconditions:
- ABC 使用轻量点位读取；只比较既有几何标准，不检查法线或 UV。有限仿射镜像和零缩放可比较，非有限点或非仿射矩阵拒绝。
- 项目配置通过统一 config/{project}_config.json 接口加载。
- 后台模式由 CGI Worker 打开或复用对应 DCC 场景。
idempotent: true
outputs:
  output_path: Actual operation output path; present only when this branch produces
    or identifies a file.
  matched_total: 'Optional by action: matched total returned by the source implementation.'
  matched_same: 'Optional by action: matched same returned by the source implementation.'
  matched_different: 'Optional by action: matched different returned by the source
    implementation.'
  only_source: 'Optional by action: only source returned by the source implementation.'
  only_target: 'Optional by action: only target returned by the source implementation.'
  blocking: 'Optional by action: blocking returned by the source implementation.'
  compare_result: 'Optional by action: compare result returned by the source implementation.'
  action_counts: 'Optional by action: action counts returned by the source implementation.'
  compare_sources: 'Optional by action: compare sources returned by the source implementation.'
  matched_same_items: 'Optional by action: matched same items returned by the source
    implementation.'
  matched_different_items: 'Optional by action: matched different items returned by
    the source implementation.'
  only_source_items: 'Optional by action: only source items returned by the source
    implementation.'
  only_target_items: 'Optional by action: only target items returned by the source
    implementation.'
  hierarchy_match: 'Optional by action: hierarchy match returned by the source implementation.'
  summary: Optional framework operation summary; present when the adapter supplies
    one.
  items: Optional framework item records; present when the adapter supplies them.
statuses:
- SUCCESS
- PARTIAL
- ERROR
- BLOCKED
- NEEDS_ATTENTION
- TIMEOUT
- CANCELLED
errors:
  API_OPERATION_ERROR: 操作执行失败，详见报告。
  API_IMPLEMENTATION_MISSING: 目录存在但没有本地实现。
recovery:
- 读取 api_help 获取参数、前置条件和输出。
- 失败时检查任务报告中的错误与恢复建议。
help:
  summary: 纯 JSON/ABC 数据对比。三步漏斗（路径→等点数→空间）配对，输出 source 侧每个 mesh 相对 target 的 4 种事实归属 + 算法层 7 标签细分。
  usage: execute_api(pipeline.pipeline.pipeline_compare_asset, params={...})
  scenario: 纯 JSON/ABC 数据对比。三步漏斗（路径→等点数→空间）配对，输出 source 侧每个 mesh 相对 target 的 4 种事实归属 + 算法层 7 标签细分。
  safety: 具体副作用见本契约 effects；运行上下文、路径与恢复边界见 docs/architecture/pipeline_runtime_contract_v1.md。
tests:
  contract: api.registry loads this manifest and api.runner validates its receipt.
  smoke: 代表性 workflow 统一验收。
implementation:
  status: implemented
verification:
  level: live_tested
  evidence:
  - audit/api-44d5e072be86.json
handler: cgi_pipeline.capabilities.pipeline.pipeline.pipeline_compare_asset.adapter:execute
