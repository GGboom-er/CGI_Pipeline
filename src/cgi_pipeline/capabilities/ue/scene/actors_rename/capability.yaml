api_id: ue.scene.actors.rename
version: 1.0.1
executor: ue
capability: scene.actors
operation: rename
stages: [editor]
targets: [level_actor]
access: write
effects:
  scene_write: Changes actor labels in one editor transaction.
execution_modes: [foreground]
surfaces: [ue, service]
modes: [apply]
inputs:
  items: {type: array, required: true, description: actor and new_label pairs.}
  max_items: {type: integer, default: 200, description: "Maximum actors, hard limit 1000."}
preconditions: [Runs in UE5 Editor with a loaded writable level.]
idempotent: true
outputs:
  items: Per-item before and after actor identity.
  count: Number of returned or processed items for this action.
  error_count: Number of failed per-item operations.
  truncated: Whether input exceeded max_items.
statuses: [SUCCESS, PARTIAL, ERROR]
errors: {UE_SCENE_CORE_OPERATION_FAILED: Invalid actor or label.}
recovery: [Use object paths for ambiguous actors; undo if needed.]
help: {summary: Rename UE actor labels., usage: "execute_api(ue.scene.actors.rename, params={items})", scenario: Apply bounded actor label edits., safety: Undoable editor write.}
tests: {contract: tests/test_ue_scene_core_apis.py, smoke: UE5 Editor rename and undo.}
handler: cgi_pipeline.capabilities.ue.scene_core:rename_actors
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_ue_scene_core_apis.py]}
