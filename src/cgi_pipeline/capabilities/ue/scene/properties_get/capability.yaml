api_id: ue.scene.properties.get
version: 1.0.1
executor: ue
capability: scene.properties
operation: get
stages: [editor]
targets: [level_actor]
access: read
effects:
  scene_read: Reads explicit editor properties from bounded actors.
execution_modes: [foreground]
surfaces: [ue, service]
modes: [inspect]
inputs:
  items: {type: array, required: true, description: actor and properties entries.}
