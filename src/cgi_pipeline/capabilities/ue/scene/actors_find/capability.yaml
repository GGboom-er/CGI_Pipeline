api_id: ue.scene.actors.find
version: 1.0.1
executor: ue
capability: scene.actors
operation: find
stages: [editor]
targets: [level_actor]
access: read
effects:
  scene_read: Finds bounded loaded-level actors by pattern and class.
execution_modes: [foreground]
surfaces: [ue, service]
modes: [inspect]
inputs:
  patterns: {type: array, default: ['*'], description: "Actor path, name, or label patterns."}
  class_name: {type: string, default: '', description: Optional exact actor class name.}
  max_items: {type: integer, default: 200, description: "Maximum results, hard limit 1000."}
preconditions: [Runs in UE5 Editor with a loaded level.]
idempotent: true
outputs:
  items: Actor identity rows.
  count: Number of returned or processed items for this action.
  truncated: Whether matches exceeded max_items.
statuses: [SUCCESS, ERROR]
errors: {UE_SCENE_CORE_OPERATION_FAILED: Invalid query or editor context.}
recovery: [Correct the query or reduce max_items.]
help: {summary: Find loaded-level UE actors., usage: "execute_api(ue.scene.actors.find, params={patterns, class_name})", scenario: Discover actors before edits., safety: Read-only and bounded.}
tests: {contract: tests/test_ue_scene_core_apis.py, smoke: UE5 Editor loaded-level query.}
handler: cgi_pipeline.capabilities.ue.scene_core:find_actors
implementation: {status: implemented}
verification: {level: contract_tested, evidence: [tests/test_ue_scene_core_apis.py]}
